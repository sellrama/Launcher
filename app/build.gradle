plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rzone.hyper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rzone.hyper'
        minSdk 27
        targetSdk 34
        // Naik otomatis di setiap build CI agar APK baru bisa dipasang menimpa yang lama.
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int
        versionCode 100 + run
        versionName '8.0' + (run > 0 ? ".${run}" : '')
    }

    // Kunci tanda tangan TETAP (dulu kunci debug berubah tiap build CI → harus uninstall).
    // Semua build (debug & release) memakai kunci ini, jadi update cukup dipasang menimpa.
    signingConfigs {
        hyper {
            storeFile rootProject.file('keystore/hyper.jks')
            storePassword 'rzonehyper'
            keyAlias 'hyper'
            keyPassword 'rzonehyper'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.hyper
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.hyper
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Depth otomatis: memotong subjek dari foto (ML Kit Subject Segmentation)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
