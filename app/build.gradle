plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rzone.hyper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rzone.hyper'
        minSdk 27
        targetSdk 34
        versionCode 7
        versionName '6.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ditandatangani dengan kunci debug agar APK release bisa langsung dipasang.
            // Ganti dengan keystore sendiri untuk rilis resmi.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Depth otomatis: memotong subjek dari foto (ML Kit Subject Segmentation)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
