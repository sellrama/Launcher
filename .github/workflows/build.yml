name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug & release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RZONE-Hyper-v6.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/RZONE-Hyper-v6.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RZONE-Hyper-v6.0
          path: out/*.apk
