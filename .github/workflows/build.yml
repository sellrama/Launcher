name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cek API Tira (semua otak Nexray)
        continue-on-error: true
        run: |
          for b in claude gpt4 gemini deepseek gpt copilot llama qwen; do
            echo "=== $b"
            curl -sS -m 30 -G "https://api.nexray.eu.cc/ai/$b" --data-urlencode "text=Jawab satu kata: halo" -w "\nHTTP %{http_code}\n" | head -c 400; echo
          done

      - name: Build debug & release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RZONE-Hyper-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/RZONE-Hyper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RZONE-Hyper
          path: out/*.apk

      - name: Pillow (untuk mengecilkan screenshot)
        run: pip install --quiet pillow || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot di emulator
        continue-on-error: true
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ci/screens.sh

      - name: Commit screenshot ke branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          [ -d ci-screens ] || exit 0
          git config user.name "hyper-ci"
          git config user.email "hyper-ci@users.noreply.github.com"
          git add -f ci-screens
          git commit -qm "ci: screenshot $GITHUB_SHA [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
